# Network
server=1
listen=1
prune=0
dbcache=384

# RPC - DEV ONLY defaults; override rpcpassword via BITCOIN_RPC_PASSWORD env in production
rpcuser=bitcoin
rpcpassword=bitcoinrpc
rpcallowip=0.0.0.0/0
rpcbind=0.0.0.0

# Connection
maxconnections=40
rpcworkqueue=128
rpcservertimeout=30

# Disable wallet
disablewallet=1

# No txindex (avoids LevelDB corruption on FUSE)
txindex=0

# Data directory
datadir=/home/bitcoin/.bitcoin

# Debug
printtoconsole=1
