# Network
server=1
listen=1
# Pruned node: full mainnet (~700GB) does not fit on the 489GB data disk.
# 100GB keeps ~1.5y of blk files; decoder ingests each file as IBD writes it.
prune=100000
dbcache=384

# RPC - override rpcpassword via BITCOIN_RPC_PASSWORD env in production.
# Bind localhost by default; compose maps 8332 only for dev convenience.
rpcuser=bitcoin
rpcpassword=bitcoinrpc
rpcallowip=127.0.0.1/32
rpcbind=127.0.0.1

# Connection
maxconnections=40
rpcworkqueue=128
rpcservertimeout=30

# Disable wallet
disablewallet=1

# No txindex (avoids LevelDB corruption on FUSE)
txindex=0

# Data directory
datadir=/home/bitcoin/.bitcoin

# Debug
printtoconsole=1
