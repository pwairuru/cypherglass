[package]
name = "decoder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
bitcoin = "0.32"
clickhouse = "0.15.3"
hex = "0.4"
notify = "8"
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
strip = true
