[project]
name = "cypherglass-backend"
version = "0.1.0"
description = "CypherGlass Analytics API (FastAPI + SQLModel + ClickHouse read + Valkey)"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.110,<1",
    "sqlmodel>=0.0.14",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "clickhouse-connect",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
    "uvicorn[standard]>=0.30",
    "gunicorn>=22",
    "httpx>=0.27,<0.29",
    "anyio>=4",
    "python-multipart>=0.0.9",
    "PyJWT>=2.8",
    "bcrypt>=4.0",
    "celery>=5.3",
    "valkey>=6.0",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
