services:
  # --- S3-compatible storage (local dev) ---
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
    volumes:
      - ${DATA_ROOT:-./volumes}/rustfs:/data
    command: server /data --console-address :9001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Bucket creator (runs once) ---
  create-buckets:
    image: minio/mc:latest
    container_name: create-buckets
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint: /bin/sh
    command: >
      -c "
      mc alias set local http://rustfs:9000 ${AWS_ACCESS_KEY_ID:-rustfsadmin} ${AWS_SECRET_ACCESS_KEY:-rustfsadmin};
      mc mb --ignore-existing local/${JUICE_BUCKET:-juicefs-blockchain};
      mc mb --ignore-existing local/${CLICKHOUSE_BUCKET:-clickhouse-storage};
      echo 'Buckets created.';
      "

  # --- Valkey ---
  valkey:
    image: valkey/valkey:8
    container_name: valkey
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf
      - ${DATA_ROOT:-./volumes}/valkey:/data
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- Bitcoin Core + JuiceFS + Decoder (all-in-one, Rust decoder) ---
  bitcoin-knots:
    build:
      context: .
      dockerfile: juicefs/Dockerfile.allinone
    container_name: bitcoin-knots
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
      - no-new-privileges:true
    depends_on:
      rustfs:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    environment:
      ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-rustfsadmin}
      SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-rustfsadmin}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: bitcoin
      BLOCKS_DIR: /home/bitcoin/.bitcoin/blocks
      STATE_FILE: /data/decoder_state.json
      BITCOIND_EXTRA_ARGS: ${BITCOIND_EXTRA_ARGS:-}
    volumes:
      - ./bitcoin/bitcoin.conf:/tmp/bitcoin.conf
      - ${DATA_ROOT:-./volumes}/decoder:/data
    ports:
      - "127.0.0.1:8332:8332"
      - "127.0.0.1:8333:8333"
    restart: unless-stopped
    stop_grace_period: 300s

  # --- ClickHouse ---
  clickhouse:
    image: clickhouse/clickhouse-server:26.7
    container_name: clickhouse
    depends_on:
      rustfs:
        condition: service_healthy
      create-buckets:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 0
    ports:
      - "127.0.0.1:8124:8123"
      - "127.0.0.1:9005:9000"
    volumes:
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/storage.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ${DATA_ROOT:-./volumes}/clickhouse:/var/lib/clickhouse
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "-q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Analytics MVP (Task 4) ---
  pg:
    image: postgres:16
    container_name: cypherglass-pg
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cypher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cypher}
      POSTGRES_DB: ${POSTGRES_DB:-cypher}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ${DATA_ROOT:-./volumes}/pg:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cypher"]
      interval: 10s
      timeout: 5s
      retries: 5

  valkey-app:
    image: valkey/valkey:8
    container_name: cypherglass-valkey-app
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - ${DATA_ROOT:-./volumes}/valkey-app:/data
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
    # Prod: VALKEY_PASSWORD required; dev empty = no auth (localhost-bound).
    # Challenge + OAuth state data is ephemeral (TTL 300/600s), so enabling
    # auth later only drops pending challenges (clients re-issue).
    command: >
      sh -c 'if [ -n "$VALKEY_PASSWORD" ]; then exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes --dir /data; else exec valkey-server --appendonly yes --dir /data; fi'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$VALKEY_PASSWORD\" ]; then valkey-cli -a \"$VALKEY_PASSWORD\" ping; else valkey-cli ping; fi"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend-rs/Dockerfile
    container_name: cypherglass-api
    depends_on:
      pg:
        condition: service_healthy
      valkey-app:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cypher}:${POSTGRES_PASSWORD:-cypher}@pg:5432/${POSTGRES_DB:-cypher}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey-app:6379/0}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bitcoin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bitcoin_clickhouse}
      CLICKHOUSE_DATABASE: bitcoin
      JWT_SECRET: ${JWT_SECRET:-dev-only-not-for-prod-0123456789abcdef0123456789abcdef01234567}
      ENV: ${ENV:-dev}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8002}
    ports:
      - "127.0.0.1:8002:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./backend
    container_name: cypherglass-worker
    profiles: ["worker"]
    depends_on:
      valkey-app:
        condition: service_healthy
      pg:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cypher}:${POSTGRES_PASSWORD:-cypher}@pg:5432/${POSTGRES_DB:-cypher}
      VALKEY_URL: ${VALKEY_URL:-redis://valkey-app:6379/0}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-bitcoin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-bitcoin_clickhouse}
    command: celery -A app.workers.celery_app.celery_app worker --beat --loglevel=info
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8002
    container_name: cypherglass-frontend
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:80"
    restart: unless-stopped
